<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Review",
  "author": {
    "@type": "Person",
    "name": "{{ page.name | escape }}"{% if page.job_title %},
    "jobTitle": "{{ page.job_title | escape }}"{% endif %}
  },
  "reviewBody": "{{ page.short_version | markdownify | strip_html | strip_newlines | escape }}",
  "itemReviewed": {
    "@type": "Product",
    "name": "Professional Salary Negotiation",
    "url": "https://fearlesssalarynegotiation.com/coach/",
    "provider": {
      "@type": "Person",
      "name": "Josh Doody",
      "url": "https://fearlesssalarynegotiation.com/about/"
    },
    "offers": {
      "@type": "Offer",
      "price": "4000.00",
      "priceCurrency": "USD",
      "description": "Strategy Component: $4,000. Improvement Component: 10% of the negotiated first-year compensation improvement.",
      "url": "https://fearlesssalarynegotiation.com/coach/"
    }{% if page.company %},
    "serviceOutput": "{{ page.result_summary | escape }}"{% endif %}
  }{% if page.company %},
  "about": {
    "@type": "Organization",
    "name": "{{ page.company | escape }}"
  }{% endif %}
}
</script>
